name: Bug report
description: Report a problem with blueprint.sh or a blueprint
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report!
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `bash blueprint.sh --version`
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [blueprint.sh, ts-react, node-api, python, docs, CI]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you run, in which directory?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: Paste any error output here
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, bash version (`bash --version`), shell
    validations:
      required: false