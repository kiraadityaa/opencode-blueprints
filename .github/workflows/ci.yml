name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint blueprint.sh
        run: shellcheck blueprint.sh

  validate-blueprints:
    name: Validate blueprints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run built-in validator (test all)
        run: bash blueprint.sh test all

  detect-smoke:
    name: Detect smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: detect --json output is valid and banner-free
        run: |
          set -euo pipefail
          mkdir -p /tmp/react && printf '{"dependencies":{"react":"^18","next":"^14"}}\n' > /tmp/react/package.json
          [ "$(bash blueprint.sh detect /tmp/react --json)" = '{"blueprint":"ts-react","detected_by":"package.json (next + react)"}' ]
          bash blueprint.sh detect /tmp/react --json | python3 -m json.tool >/dev/null
          mkdir -p /tmp/empty
          bash blueprint.sh detect /tmp/empty && exit 1 || echo "ok: empty dir exits non-zero"
          echo "detect ok"

  init-smoke:
    name: Init smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Real init of each blueprint in a temp project
        run: |
          set -euo pipefail
          for meta in blueprints/*/blueprint.meta; do
            name="$(sed -n 's/^name: *//p' "$meta" | head -n 1)"
            project="$(mktemp -d)"
            bash blueprint.sh init "$name" --dir "$project" --force
            test -f "$project/.opencode/opencode.json"
            test -f "$project/.opencode/AGENTS.md"
            diff "$project/.opencode/opencode.json" "blueprints/$name/opencode.json"
            if [ -d "blueprints/$name/agents" ]; then
              for f in blueprints/$name/agents/*.md; do
                test -f "$project/.opencode/agents/$(basename "$f")" \
                  || { echo "missing agent $(basename "$f")"; exit 1; }
              done
            fi
            if [ -d "blueprints/$name/commands" ]; then
              for f in blueprints/$name/commands/*.md; do
                test -f "$project/.opencode/commands/$(basename "$f")" \
                  || { echo "missing command $(basename "$f")"; exit 1; }
              done
            fi
            echo "ok: $name deploys"
            rm -rf "$project"
          done
      - name: Dry-run must not write files
        run: |
          set -euo pipefail
          project="$(mktemp -d)"
          bash blueprint.sh init ts-react --dir "$project" --dry-run --force
          test ! -d "$project/.opencode" && echo "ok: dry-run leaves no trace"